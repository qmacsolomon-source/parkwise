<!--
  Landing page for the "forgot password" email link. Supabase's recovery
  link puts a temporary session in the URL when it opens this page - this
  page uses that session to let the customer actually type a new password,
  then calls supabase.auth.updateUser({ password }).

  Setup (same two steps as web/email-confirmed.html):
    1. Fill in SUPABASE_URL and SUPABASE_ANON_KEY below - the same two values
       already in mobile/.env as EXPO_PUBLIC_SUPABASE_URL and
       EXPO_PUBLIC_SUPABASE_ANON_KEY (Supabase Dashboard -> Settings -> API).
       The anon key is meant to be public - it's already shipped inside the
       compiled mobile app - so it's fine for it to sit in this file too.
    2. Deploy this file somewhere public (GitHub Pages, same as
       email-confirmed.html), then:
         a. Put its URL in mobile/.env as EXPO_PUBLIC_RESET_PASSWORD_URL.
         b. Add that same URL in Supabase: Authentication -> URL
            Configuration -> Redirect URLs (it has to be allow-listed there
            or Supabase will refuse to redirect to it).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password - ParkWise</title>
<style>
  :root {
    --bg: #F6F8FB;
    --surface: #FFFFFF;
    --ink: #0F2A4A;
    --ink-muted: #5B7088;
    --line: #E2E8F0;
    --line-strong: #CBD5E1;
    --brand: #0F2A4A;
    --brand-tint: #E8EEF6;
    --success: #15803D;
    --success-tint: #DCFCE7;
    --danger: #B91C1C;
    --danger-tint: #FEE2E2;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0A1D33;
      --surface: #11263F;
      --ink: #F2F6FB;
      --ink-muted: #9FB3C8;
      --line: #223B57;
      --line-strong: #2D4C6D;
      --brand: #6FA8E8;
      --brand-tint: #16314F;
      --success: #4ADE80;
      --success-tint: #103322;
      --danger: #F87171;
      --danger-tint: #3A1414;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 28px 32px;
    box-shadow: 0 1px 2px rgba(15, 42, 74, 0.04), 0 12px 32px rgba(15, 42, 74, 0.08);
  }

  .badge {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 16px;
    background: var(--brand-tint);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .badge svg { width: 28px; height: 28px; }
  .badge svg path { stroke: var(--brand); }
  .badge.success { background: var(--success-tint); }
  .badge.success svg path { stroke: var(--success); }
  .badge.danger { background: var(--danger-tint); }
  .badge.danger svg path { stroke: var(--danger); }

  h1 {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
    text-align: center;
  }

  p {
    margin: 0 0 20px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink-muted);
    text-align: center;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 11px 12px;
    margin-bottom: 14px;
  }
  input:focus {
    outline: none;
    border-color: var(--brand);
  }

  button {
    width: 100%;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    color: #FFFFFF;
    background: var(--brand);
    border: none;
    border-radius: 10px;
    padding: 13px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .field-error {
    font-size: 13px;
    color: var(--danger);
    margin: -10px 0 12px;
  }

  .banner {
    font-size: 14px;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 16px;
    text-align: left;
  }
  .banner.danger { background: var(--danger-tint); color: var(--danger); }

  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <!-- Form state: a valid recovery session was found. -->
    <div id="form-state">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm2-10V7a4 4 0 118 0v2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Set a new password</h1>
      <p>Choose a new password for your ParkWise account.</p>

      <div id="form-banner" class="banner danger hidden"></div>

      <form id="reset-form">
        <label for="password">New password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required>

        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
        <div id="confirm-error" class="field-error hidden">Passwords do not match.</div>

        <button id="submit-btn" type="submit">Set new password</button>
      </form>
    </div>

    <!-- Success state. -->
    <div id="success-state" class="hidden">
      <div class="badge success" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 13l4 4L19 7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Password updated</h1>
      <p>You can close this page and log in with your new password.</p>
    </div>

    <!-- Expired/invalid link state: no recovery session was found. -->
    <div id="invalid-state" class="hidden">
      <div class="badge danger" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 9v4m0 4h.01M12 3l9 16H3L12 3z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>This link has expired</h1>
      <p>Request a new "Forgot password" email from the app and open the newest link - each one only works once.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    // Fill these in - see the setup comment at the top of this file.
    const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    const formState = document.getElementById('form-state');
    const successState = document.getElementById('success-state');
    const invalidState = document.getElementById('invalid-state');
    const form = document.getElementById('reset-form');
    const banner = document.getElementById('form-banner');
    const submitBtn = document.getElementById('submit-btn');
    const confirmError = document.getElementById('confirm-error');

    function showBanner(message) {
      banner.textContent = message;
      banner.classList.remove('hidden');
    }

    function showState(state) {
      formState.classList.add('hidden');
      successState.classList.add('hidden');
      invalidState.classList.add('hidden');
      state.classList.remove('hidden');
    }

    if (SUPABASE_URL.indexOf('YOUR_') === 0 || SUPABASE_ANON_KEY.indexOf('YOUR_') === 0) {
      showBanner('This page is not configured yet - SUPABASE_URL/SUPABASE_ANON_KEY still need to be filled in.');
    } else {
      const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // The recovery link's tokens are in the URL hash. The client reads them
      // automatically on load; this just waits for that to finish before
      // deciding whether a usable session actually came out of it.
      client.auth.getSession().then(({ data }) => {
        if (!data.session) {
          showState(invalidState);
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;

        if (password !== confirm) {
          confirmError.classList.remove('hidden');
          return;
        }
        confirmError.classList.add('hidden');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Setting password...';

        const { error } = await client.auth.updateUser({ password });

        if (error) {
          showBanner(error.message || 'Could not update your password. The link may have expired.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Set new password';
          return;
        }

        showState(successState);
      });
    }
  </script>
</body>
</html>
